[grid]
	#Width/depth of each plot in chunk units (northwest-aligned).
	# Default: 5
	# Range: 1 ~ 32
	plot_chunk_size = 5
	#Air/strip gap between plots in chunk units.
	# Default: 1
	# Range: 0 ~ 8
	gap_chunk_size = 1
	#Plots along +X before advancing +Z.
	# Default: 5
	# Range: 1 ~ 256
	plots_per_row = 5
	#Number of plot rows along +Z.
	# Default: 5
	# Range: 1 ~ 256
	prebuild_rows = 5

[heights]
	#Single bedrock layer under each plot column (inter-plot gaps are air only—no bedrock slab there).
	#Together with floor_top_y this forms a 5-block stack: one bedrock + four floor layers (default 55–59).
	# Default: 55
	# Range: -64 ~ 320
	bedrock_y = 55
	#Top Y (inclusive) of the floor slab stack above bedrock_y — typically bedrock_y + 4 for four floor layers.
	# Default: 59
	# Range: -64 ~ 320
	floor_top_y = 59
	# Default: 63
	# Range: -64 ~ 320
	teleport_y = 63
	#Top Y (inclusive) for non-air block writes in the build dimension. Must cover the full dimension slice for tall structures
	#(Create, Create Aeronautics / Sable sub-levels, etc.); otherwise assembly can fail and Sable may remove sub-levels with "extreme Y coordinate range".
	# Default: 319
	# Range: -64 ~ 319
	build_max_y = 319

[performance]
	#How often the generator advances work (in ticks).
	# Default: 1
	# Range: 1 ~ 200
	plotgen_interval_ticks = 1
	#Soft budget for native block writes per server tick while generating.
	# Default: 65536
	# Range: 1024 ~ 1000000
	blocks_per_tick = 65536

[editing]
	#Maximum blocks changed by selection fill/clear per request.
	# Default: 2048
	# Range: 1 ~ 1000000
	max_selection_blocks = 2048
	#Item id used like a WorldEdit axe for two-corner selection inside your plot.
	selection_tool = "minecraft:wooden_axe"

[admin]
	#If true, operators (permission level 4+) see extra tools on the normal /plot screen (e.g. regen unclaimed) on dedicated servers.
	#When false, those buttons only appear in a development (IDE) environment.
	#The dedicated /plot admin GUI and command require permission level 4+ regardless of this flag.
	allow_plot_admin_tools = false

[restrictions]
	#Block IDs (modid:path) that cannot exist in the build dimension (any write path, including schematics).
	#Non-air blocks above build_max_y are also rejected (air is still allowed so illegal blocks can be cleared).
	#Ender chest placement is always allowed in code (even if an old serverconfig still lists minecraft:ender_chest here); use blocked_block_right_clicks to block opening it in the build dim.
	#Edit the live list in saves/<world>/serverconfig/build_dim-server.toml under [restrictions] -> blocked_block_placements.
	#If you upgraded from an older BuildDim, that file may still have an old list — add new IDs there manually; defaults are not merged into existing configs.
	blocked_block_placements = ["minecraft:end_portal", "minecraft:end_portal_frame", "minecraft:end_gateway", "numismatics:bank_terminal", "nts:sell_station"]
	#Block IDs (modid:path) that cannot be right-clicked (use) in the build dimension.
	#Applies to the clicked block; cancel is server-side and runs before plot selection tool handling.
	#Create: Northstar Redux uses mod id northstar — rocket controls are northstar:rocket_controls.
	#Edit in serverconfig under [restrictions] -> blocked_block_right_clicks.
	blocked_block_right_clicks = ["minecraft:ender_chest", "northstar:rocket_controls"]
	#Root command literals to block (NeoForge CommandEvent). Each entry must be a TOML string in double quotes.
	#Example: blocked_commands = ["enderchest", "ftbchunks", "ftbteams"] — invalid TOML (e.g. [enderchest] without quotes) fails to load and NeoForge may reset this file to defaults.
	#One word: matches the first token (/foo -> foo). Multiple words: matches that prefix (/ender chest -> use "ender chest" or block only "ender").
	#Comparison is case-insensitive. When blocked_commands_only_in_build_dimension is true, only players in the build dimension are affected.
	#Does not affect the console or command blocks (player chat/commands only).
	#FTB Chunks: blocking /ftbchunks here does not stop the map GUI from claiming or force-loading chunks.
	#Add dimension build_dim:build to FTB Chunks' serverconfig denylist / no-claim list for your pack (key names depend on FTB Chunks version; check ftbchunks-world.snbt after first boot).
	#FTB Quests: progression is not dimension-scoped; players can complete tasks in the build dimension and claim rewards elsewhere.
	#Use pack design (task types), KubeJS, or stages — BuildDim does not integrate FTB Quests APIs.
	blocked_commands = []
	blocked_commands_only_in_build_dimension = true

[spawn]
	#Dimension to send players when they remove their plot.
	dimension = "minecraft:overworld"
	# Default: 0
	# Range: -30000000 ~ 30000000
	x = 0
	# Default: 64
	# Range: -64 ~ 320
	y = 64
	# Default: 0
	# Range: -30000000 ~ 30000000
	z = 0
